# Konfigurasi Cloudflare Pages + D1.
#
# CATATAN: `wrangler pages deploy` tidak menerima path config kustom, jadi
# binding harus ditulis di file ini. database_id dan bucket_name BUKAN rahasia
# (hanya pengenal resource) — kredensial tetap di Secret dashboard.

name = "dewabalitour"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "dewabalitour"
database_id = "d3a1d96e-1510-488f-b66d-266c5165b63b"

# Penyimpanan foto hasil unggah admin (opsional, aktifkan unggah foto).
# Buat dulu: npx wrangler r2 bucket create dewabalitour-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "dewabalitour-media"

# Secret yang disarankan (set di dashboard → Settings → Environment variables):
#   SESSION_SECRET, ADMIN_EMAIL, RESEND_API_KEY, MAIL_FROM
#   (opsional) ADMIN_USER, ADMIN_PASSWORD_HASH, ADMIN_RESET
